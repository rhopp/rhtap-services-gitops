apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artifactory
  namespace: gitops-resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gitops-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: artifactory
  
  # --- NEW: Use the 'sources' field instead of 'source' ---
  sources:
    # Source 1: The raw Kubernetes manifests for the Secret and ConfigMap
    - repoURL: 'https://github.com/rhopp/rhtap-services-gitops'
      targetRevision: artifactory
      path: 'components/artifactory'
    
    # Source 2: The Helm chart for Artifactory
    - repoURL: 'https://charts.jfrog.io'
      chart: artifactory-jcr
      targetRevision: 7.18.6
      helm:
        values: |
          containerSecurityContext:
            enabled: false
          artifactory:
            podSecurityContext:
              enabled: false
          #   image:
          #     repository: releases-docker.jfrog.io/jfrog/artifactory-jcr
          #     version: 7.71.5
          nginx:
            podSecurityContext:
              enabled: false
            containerSecurityContext:
              enabled: false

          postgresql:
            enabled: true
            postgresqlPassword: "a-strong-password"
            primary:
              podSecurityContext:
                enabled: false
              securityContext:
                enabled: false
              containerSecurityContext:
                enabled: false

          # Arrr! Configure the init containers resources as the chart expects
          initContainers:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi

          # Arrr! Add our custom init container using extraInitContainers
          extraInitContainers:
            - name: setup-artifactory
              image: "alpine/curl:3.14"
              command: ["/bin/sh", "-c", "/scripts/setup.sh"]
              volumeMounts:
                - name: setup-script
                  mountPath: /scripts
                - name: admin-creds
                  mountPath: /etc/artifactory-creds

          extraVolumes:
            - name: setup-script
              configMap:
                name: artifactory-setup-script
                defaultMode: 0755
            - name: admin-creds
              secret:
                secretName: artifactory-admin-creds

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true